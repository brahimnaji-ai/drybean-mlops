name: DVC remote check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dvc-roundtrip:
    name: DVC round-trip
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Configure CI DVC remote
        run: bash scripts/ci_configure_dvc_remote.sh
        env:
          DVC_S3_BUCKET: ${{ secrets.DVC_S3_BUCKET }}
          DVC_S3_ENDPOINT_URL: ${{ secrets.DVC_S3_ENDPOINT_URL }}

      - name: Verify DVC round-trip
        run: DVC_REMOTE=ci bash scripts/dvc_roundtrip.sh
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
