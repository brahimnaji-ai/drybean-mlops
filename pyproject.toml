[project]
name = "drybean"
version = "0.1.0"
description = "Automated MLOps pipeline for UCI Dry Bean classification"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14,<3.15"
dependencies = [
    "dvc[s3]>=3.67.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drybean"]

[dependency-groups]
dev = [
    "ruff>=0.17.5,<0.18.0",
    "mypy>=2.4.1,<3.0.0",
    "pytest>=9.2.0,<10.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "pre-commit>=4.7.0,<5.0.0",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["drybean"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov --cov-report=term-missing --cov-fail-under=80 -m 'not integration'"
markers = ["integration: requires the docker compose stack"]

[tool.coverage.run]
source = ["src/drybean"]
branch = true
